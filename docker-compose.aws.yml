services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-klyvorek}
      POSTGRES_USER: ${DB_USER:-klyvorek_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "15m"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until ollama list >/dev/null 2>&1; do echo 'Waiting for Ollama...'; sleep 2; done; ollama pull llama3.2:latest"
    depends_on:
      - ollama
    restart: "no"

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_plans &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000
             --workers $${GUNICORN_WORKERS:-3} --timeout 180 --access-logfile - --error-logfile -"
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      USE_SQLITE: "False"
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull-model:
        condition: service_completed_successfully
    restart: unless-stopped

  celery:
    build: .
    command: sh -c 'celery -A core worker --loglevel=info --concurrency=$${CELERY_CONCURRENCY:-1}'
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      USE_SQLITE: "False"
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull-model:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      USE_SQLITE: "False"
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/aws.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/cloudflare-origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./secrets/cloudflare-origin.key:/etc/nginx/certs/origin.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
